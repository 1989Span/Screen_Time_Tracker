plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.span1989.gauge.usagestats'
version = '0.1.0'

android {
  namespace "com.span1989.gauge.usagestats"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // JVM unit tests for the widget's arithmetic (widget/WidgetMath.kt), which has
  // no Android dependencies so it can be checked without a device.
  testImplementation 'junit:junit:4.13.2'
}
